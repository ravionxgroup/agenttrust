name: SDK and Console CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sdk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    name: Python ${{ matrix.python }} local SDK
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared extras
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          python -m pip install --upgrade pip
          if [ "$PYTHON_VERSION" = 3.9 ]; then
            python -m pip install -e ".[dev,gateway]"
          else
            python -m pip install -e ".[dev,gateway,mcp]"
          fi
          python -m pip check
      - name: SDK regression tests (real Gateway tests run in integration)
        run: python -m pytest -q -ra --ignore=tests/test_gateway_integration.py --ignore=tests/test_mcp_interop.py
      - run: python -m unittest discover -s .github/ci -p 'test_*.py'
      - run: python -m compileall -q agenttrust examples
  console:
    name: Console tests, types, build and audits
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: console
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm test --if-present
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Full dependency audit
        run: npm audit --audit-level=moderate
      - name: Production dependency audit
        if: ${{ !cancelled() }}
        run: npm audit --omit=dev --audit-level=moderate
  security:
    name: Python dependency audit (SDK extras and demo runtime)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-container.txt
      - name: Resolve declared dependencies in an isolated environment
        run: |
          python -m venv /tmp/sdk-audit
          /tmp/sdk-audit/bin/python -m pip install -e ".[dev,gateway,mcp]"
          /tmp/sdk-audit/bin/python -m pip freeze --exclude-editable > /tmp/sdk-audit-requirements.txt
          python -m pip install pip-audit==2.10.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.10"
          cache: false
      - name: Validate GitHub Actions workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          actionlint .github/workflows/*.yml
      - name: Audit resolved SDK dependencies
        run: python -m pip_audit --strict -r /tmp/sdk-audit-requirements.txt
      - name: Audit pinned demo image dependencies
        if: ${{ !cancelled() }}
        run: python -m pip_audit --strict -r requirements-container.txt
