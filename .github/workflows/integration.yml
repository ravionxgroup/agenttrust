name: Cross-repository integration
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      platform_revision:
        description: "Optional full SHA on an agenttrust-platform branch (blank uses compatible default)"
        type: string
      sdk_revision:
        description: "Optional full SHA on an agenttrust branch (blank uses compatible default)"
        type: string
permissions:
  contents: read
concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    name: Real Gateway, independent MCP and Docker isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: cross-repository-ci
    env:
      COMPOSE_PROJECT_NAME: agenttrust-ci-${{ github.run_id }}-${{ github.run_attempt }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out CI controller
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          path: controller
          persist-credentials: false
      - name: Select reviewed revisions
        id: pair
        env:
          PLATFORM_OVERRIDE: ${{ inputs.platform_revision }}
          SDK_OVERRIDE: ${{ inputs.sdk_revision }}
          EVENT_SHA: ${{ github.sha }}
          SELF_REPOSITORY: ${{ github.repository }}
        run: python3 controller/.github/ci/select-pair.py
      - name: Require private sibling access
        env:
          SIBLING_TOKEN: ${{ secrets.AGENTTRUST_PLATFORM_READ_TOKEN }}
        run: |
          if [ -z "$SIBLING_TOKEN" ]; then
            echo "::error::BLOCKED: configure the protected cross-repository-ci environment and a contents-read-only agenttrust-platform token."
            exit 1
          fi
      - name: Check out Gateway
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ravionxgroup/agenttrust-platform
          ref: ${{ steps.pair.outputs.platform }}
          path: agenttrust-platform
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.AGENTTRUST_PLATFORM_READ_TOKEN }}
      - name: Check out SDK and Console
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ravionxgroup/agenttrust
          ref: ${{ steps.pair.outputs.sdk }}
          path: agenttrust
          fetch-depth: 0
          persist-credentials: false
      - name: Verify pair and record exact SHAs
        env:
          MANUAL_PAIR: ${{ github.event_name == 'workflow_dispatch' }}
          PLATFORM_EXPECTED: ${{ steps.pair.outputs.platform }}
          SDK_EXPECTED: ${{ steps.pair.outputs.sdk }}
        run: python3 controller/.github/ci/check-pair.py
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.x
          cache-dependency-path: agenttrust-platform/go.sum
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agenttrust/pyproject.toml
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: agenttrust/console/package-lock.json
      - name: Gateway security regression suite
        working-directory: agenttrust-platform
        run: |
          go mod download
          go mod verify
          go test ./...
          go test -race ./internal/gateway ./internal/authn ./internal/mcp
      - name: Install SDK test dependencies
        working-directory: agenttrust
        run: |
          python -m pip install -e ".[dev,gateway,mcp]"
          python -m pip check
          python -c 'import importlib.metadata as m; assert int(m.version("mcp").split(".")[0]) >= 2, "Independent interoperability requires MCP >= 2"'
      - name: Console ingestion and projection tests
        working-directory: agenttrust/console
        run: |
          npm ci
          npm test --if-present
      - name: Real SDK to Gateway and independent MCP regression suite
        working-directory: agenttrust
        env:
          AGENTTRUST_PLATFORM: ${{ github.workspace }}/agenttrust-platform
        run: |
          python -m pytest -q -ra --junitxml=/tmp/agenttrust-integration.xml
          python ../controller/.github/ci/check-results.py /tmp/agenttrust-integration.xml
      - name: Prepare ephemeral CI-only development credentials
        working-directory: agenttrust-platform
        run: ./deploy/local/prepare-credentials.sh
      - name: Validate and build all five images (no publishing)
        working-directory: agenttrust-platform
        run: |
          docker compose -f deploy/local/compose.yaml config --quiet
          docker compose -f deploy/local/compose.yaml build
      - name: Refresh short-lived token and start healthy stack
        working-directory: agenttrust-platform
        run: |
          ./deploy/local/prepare-credentials.sh
          docker compose -f deploy/local/compose.yaml up -d --wait --wait-timeout 120
      - name: SDK demo through TLS Gateway
        working-directory: agenttrust-platform
        run: docker compose -f deploy/local/compose.yaml exec -T agent python /app/container_demo.py
      - name: Runtime isolation, persistence, fail-closed audit and real Console
        working-directory: agenttrust-platform
        run: python3 deploy/local/verify.py
      - name: Safe service health diagnostics
        if: ${{ always() }}
        run: |
          if [ -f agenttrust-platform/deploy/local/compose.yaml ]; then
            docker compose -f agenttrust-platform/deploy/local/compose.yaml ps --all
          fi
      - name: Remove CI-only containers and volume
        if: ${{ always() }}
        run: |
          if [ ! -f agenttrust-platform/deploy/local/compose.yaml ]; then
            echo "No deployment checkout; no CI containers were started."
            exit 0
          fi
          case "$COMPOSE_PROJECT_NAME" in
            agenttrust-ci-*) docker compose -f agenttrust-platform/deploy/local/compose.yaml down --volumes --remove-orphans ;;
            *) echo "::error::Refusing cleanup of a non-CI project"; exit 1 ;;
          esac
      - name: Final result
        if: ${{ always() }}
        env:
          RESULT: ${{ job.status }}
        run: |
          printf 'Cross-repository integration: %s\n' "$RESULT"
          test "$RESULT" = success
