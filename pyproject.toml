[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agenttrust"
version = "0.1.0"
description = "Least-privilege identity + audit for AI agents"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = ["agents", "ai", "security", "identity", "audit", "mcp", "langchain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "PyJWT>=2.8.0",
]

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
mcp = ["mcp>=1.0"]           # requires Python >= 3.10
langchain = ["langchain-core>=0.1"]
all = ["PyYAML>=6.0", "langchain-core>=0.1"]
dev = [
    "PyYAML>=6.0",
    "langchain-core>=0.1",
    "pytest>=7.0",
]

[project.scripts]
agenttrust = "agenttrust.cli:main"

[project.urls]
Homepage = "https://github.com/ravionxgroup/agenttrust"
Repository = "https://github.com/ravionxgroup/agenttrust"
Issues   = "https://github.com/ravionxgroup/agenttrust/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["agenttrust*"]
